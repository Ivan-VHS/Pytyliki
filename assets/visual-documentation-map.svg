<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Pytyliki implementation map</title>
<desc id="desc">Architecture map: shared C11 core, processor and measurement modules, command-line tools, Windows workstation interface and safety boundaries.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#101010"/></linearGradient><linearGradient id="gold"><stop stop-color="#FFD700"/><stop offset="1" stop-color="#FFE36E"/></linearGradient><linearGradient id="teal"><stop stop-color="#79B8FF"/><stop offset="1" stop-color="#343434"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="14"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#79B8FF"/></marker></defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/><circle cx="1080" cy="25" r="150" fill="#79B8FF" opacity=".1" filter="url(#blur)"/><circle cx="95" cy="600" r="170" fill="#FFD700" opacity=".09" filter="url(#blur)"/>
<text x="56" y="68" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">PYTYLIKI / SYSTEM MAP</text><text x="58" y="98" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="15">Native processor-systems workstation · C11 core · Windows GUI + portable CLI</text>
<rect x="58" y="145" width="1084" height="116" rx="20" fill="#181818" stroke="#FFD700" stroke-opacity=".55"/><rect x="78" y="165" width="8" height="76" rx="4" fill="url(#gold)"/>
<text x="108" y="190" fill="#FFE36E" font-size="13" font-weight="700" letter-spacing="1.5" font-family="Inter,Arial,sans-serif">SHARED NATIVE FOUNDATION</text><text x="108" y="222" fill="#FFFFFF" font-size="24" font-weight="800" font-family="Inter,Arial,sans-serif">C11 Core</text><text x="108" y="244" fill="#A3A3A3" font-size="14" font-family="Inter,Arial,sans-serif">Validated types · bounded buffers · shared domain logic</text>
<path d="M600 261V303M300 303H900M300 303V332M600 303V332M900 303V332" stroke="#79B8FF" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity=".85"/>
<g font-family="Inter,Arial,sans-serif"><rect x="58" y="345" width="328" height="142" rx="18" fill="#181818" stroke="#79B8FF" stroke-opacity=".7"/><text x="82" y="380" fill="#FFE36E" font-size="13" font-weight="700">SYSTEM MODULES</text><text x="82" y="414" fill="#FFFFFF" font-size="19" font-weight="750">CPU · Memory · Embedded</text><text x="82" y="443" fill="#D8D8D8" font-size="14">Profiles · ISA/XCR0 · checked ranges</text><text x="82" y="466" fill="#A3A3A3" font-size="13">Read-only discovery / reference models</text>
<rect x="436" y="345" width="328" height="142" rx="18" fill="#181818" stroke="#FFD700" stroke-opacity=".7"/><text x="460" y="380" fill="#FFE36E" font-size="13" font-weight="700">COMPUTE &amp; EVIDENCE</text><text x="460" y="414" fill="#FFFFFF" font-size="19" font-weight="750">Benchmarks · DSP · TRACE</text><text x="460" y="443" fill="#D8D8D8" font-size="14">Bounded workloads · local PCM · provenance</text><text x="460" y="466" fill="#A3A3A3" font-size="13">Advisory plans; no claimed speedup</text>
<rect x="814" y="345" width="328" height="142" rx="18" fill="#181818" stroke="#79B8FF" stroke-opacity=".7"/><text x="838" y="380" fill="#79B8FF" font-size="13" font-weight="700">APPLICATION SURFACES</text><text x="838" y="414" fill="#FFFFFF" font-size="19" font-weight="750">CLI · Windows GUI</text><text x="838" y="443" fill="#D8D8D8" font-size="14">APSIA · Metrics · QCS tools</text><text x="838" y="466" fill="#A3A3A3" font-size="13">CMake build · CTest verification</text></g>
<rect x="58" y="523" width="1084" height="54" rx="14" fill="#050505" stroke="#A3A3A3" stroke-opacity=".5"/><circle cx="85" cy="550" r="6" fill="#6EDAA3"/><text x="104" y="555" fill="#D8D8D8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">Boundary:</text><text x="184" y="555" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">bounded local work · no automatic thread launch · no CPU affinity changes · no hardware certification</text>
</svg>