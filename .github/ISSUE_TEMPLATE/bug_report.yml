name: Bug report
description: Report a reproducible defect in Pytyliki.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: Include the exact command and complete diagnostic.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, CPU architecture and compiler
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety and evidence
      options:
        - label: This report contains no credentials or private device identifiers.
          required: true
