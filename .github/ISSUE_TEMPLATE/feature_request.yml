name: Feature request
description: Propose a focused improvement to Pytyliki.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance tests and measurable outcome
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety, portability and resource boundaries
    validations:
      required: true
