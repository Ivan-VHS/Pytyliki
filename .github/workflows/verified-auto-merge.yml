name: Verified PR Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verified-auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

  auto-merge:
    name: Auto-merge approved PR
    needs: validate
    if: github.event_name != 'workflow_dispatch' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require independent approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          approvals="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --jq '[.[] | select(.state == "APPROVED" and .user.login != env.PR_AUTHOR)] | length')"
          if [ "${approvals}" -lt 1 ]; then
            echo "Auto-merge blocked: an approval from someone other than the PR author is required."
            exit 1
          fi
      - name: Enable GitHub native auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "${PR_URL}" --auto --squash --delete-branch
