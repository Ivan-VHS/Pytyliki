name: Verified PR Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main')
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout pull request merge result
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure CMake
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

  auto-merge:
    name: Auto-merge approved PR
    needs: validate
    if: github.event_name != 'workflow_dispatch' && github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    steps:
      - name: Require stable base/head and independent approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          current_head="$(printf '%s' "${current_pr}" | jq -r '.head.sha')"
          current_base="$(printf '%s' "${current_pr}" | jq -r '.base.sha')"
          current_base_ref="$(printf '%s' "${current_pr}" | jq -r '.base.ref')"
          if [ "${current_head}" != "${PR_HEAD_SHA}" ] || [ "${current_base}" != "${PR_BASE_SHA}" ] || [ "${current_base_ref}" != "main" ] || [ "${PR_BASE_REF}" != "main" ]; then
            echo "Auto-merge blocked: PR head/base changed or the target is not main."
            exit 1
          fi
          reviews="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews")"
          approvals="$(printf '%s' "${reviews}" | jq --arg author "${PR_AUTHOR}" --arg head "${PR_HEAD_SHA}" '
            [.[][] | select(.user.login != $author)]
            | sort_by(.user.login, .submitted_at)
            | group_by(.user.login)
            | map(last)
            | map(select(.state == "APPROVED" and .commit_id == $head))
            | length
          ')"
          if ! [[ "${approvals}" =~ ^[0-9]+$ ]] || [ "${approvals}" -lt 1 ]; then
            echo "Auto-merge blocked: an approval from someone other than the PR author is required for this exact head."
            exit 1
          fi
      - name: Enable GitHub native auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "${PR_URL}" --auto --squash --delete-branch
