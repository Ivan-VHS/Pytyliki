name: Verified Mainline Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-mainline-auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
      max-parallel: 2
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure CMake
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Set up Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate automation roadmap contract
        if: runner.os == 'Linux'
        run: python scripts/validate_automation_roadmap.py --strict
      - name: Validate localized README links
        if: runner.os == 'Linux'
        run: python .github/scripts/check_readme_links.py
      - name: Validate APSIA evolution-lock schema
        if: runner.os == 'Linux'
        run: python -c "import json; json.load(open('apsia/evolution-lock.schema.json', encoding='utf-8'))"
      - name: Verify architecture contract
        if: runner.os == 'Linux'
        run: python scripts/check_architecture_contract.py
      - name: Validate low-level language systems matrix
        if: runner.os == 'Linux'
        run: python tools/systems_languages.py --verify
      - name: Verify engineering crosswalk
        if: runner.os == 'Linux'
        run: python scripts/check_chinese_proverbs_profile.py

  sanitizer:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    name: Linux ASan and UBSan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure with sanitizers
        run: cmake -S . -B build-sanitized -DBUILD_TESTING=ON -DPYTYLIKI_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build sanitized binaries
        run: cmake --build build-sanitized --parallel
      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure

  auto-merge:
    name: Enable native GitHub auto-merge
    needs: [validate, sanitizer]
    if: github.event_name != 'workflow_dispatch' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Wait for every pull-request workflow on the validated head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_WORKFLOWS: '["CodeQL Security Analysis","Beelzebul repository guard"]'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 54); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${PR_HEAD_SHA}&per_page=100")"
            state="$(jq -r \
              --arg self "${GITHUB_WORKFLOW}" \
              --arg sha "${PR_HEAD_SHA}" \
              --argjson required "${REQUIRED_WORKFLOWS}" '
                [.workflow_runs[]
                  | select(.event == "pull_request" and .head_sha == $sha and .name != $self)]
                | sort_by(.updated_at)
                | group_by(.name)
                | map(.[-1]) as $latest
                | [$required[] as $name
                    | select(([ $latest[] | select(.name == $name) ] | length) == 0)] as $missing
                | [$required[] as $name
                    | select(([ $latest[] | select(.name == $name and .status == "completed" and .conclusion == "success") ] | length) == 0
                        and ([ $latest[] | select(.name == $name and .status == "completed") ] | length) > 0)] as $required_failed
                | [$latest[] | select(.status == "completed"
                    and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] as $failed
                | [$latest[] | select(.status != "completed")] as $pending
                | if ($failed | length) > 0 then
                    "failed:" + ([ $failed[] | "\(.name)=\(.conclusion)" ] | join(","))
                  elif ($required_failed | length) > 0 then
                    "required-failed:" + ($required_failed | join(","))
                  elif ($missing | length) > 0 then
                    "missing:" + ($missing | join(","))
                  elif ($pending | length) > 0 then
                    "pending:" + ([ $pending[] | "\(.name)=\(.status)" ] | join(","))
                  else "ready"
                  end
              ' <<< "$payload")"
            echo "PR assurance attempt ${attempt}/54: ${state}"
            case "$state" in
              ready) exit 0 ;;
              failed:*|required-failed:*) echo "::error::A pull-request workflow did not pass: ${state}"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          echo "::error::Timed out waiting for all pull-request assurance workflows."
          exit 1

      - name: Confirm validated PR head is unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "${current_head}" != "${PR_HEAD_SHA}" ]; then
            echo "Auto-merge blocked: PR head changed while validation was running."
            exit 1
          fi
      - name: Require independent current-head approval and resolved review threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          author="$(jq -r '.user.login' <<< "$pr")"
          current_head="$(jq -r '.head.sha' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr")"
          base_ref="$(jq -r '.base.ref' <<< "$pr")"
          draft="$(jq -r '.draft' <<< "$pr")"

          if [[ "$current_head" != "$EXPECTED_HEAD_SHA" || "$head_repo" != "$GITHUB_REPOSITORY" || "$base_ref" != "main" || "$draft" != "false" ]]; then
            echo "::error::PR eligibility or exact head SHA changed; refusing auto-merge."
            exit 1
          fi

          reviews="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" | jq 'add')"
          review_state="$(jq -r --arg author "$author" --arg sha "$EXPECTED_HEAD_SHA" '
            [
              .[]
              | select(.submitted_at != null)
              | {
                  login: (.user.login // ""),
                  user_type: (.user.type // ""),
                  state: (.state // ""),
                  commit_id: (.commit_id // "")
                }
            ]
            | sort_by(.login, .submitted_at)
            | group_by(.login)
            | map(.[-1]) as $latest
            | if any($latest[]; .login != $author and .user_type != "Bot" and .state == "CHANGES_REQUESTED") then
                "changes-requested"
              elif any($latest[]; .login != $author and .user_type != "Bot" and .state == "APPROVED" and .commit_id == $sha) then
                "approved"
              else
                "missing-current-head-human-approval"
              end
          ' <<< "$reviews")"

          if [[ "$review_state" != "approved" ]]; then
            echo "::error::A non-author human approval on the exact current head is required: $review_state."
            exit 1
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          threads_query='query($owner: String!, $name: String!, $number: Int!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                reviewThreads(first: 100, after: $cursor) {
                  nodes { isResolved }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }'

          cursor=""
          unresolved=0
          while true; do
            if [[ -n "$cursor" ]]; then
              page="$(gh api graphql -f query="$threads_query" -F owner="$owner" -F name="$repo_name" -F number="$PR_NUMBER" -F cursor="$cursor")"
            else
              page="$(gh api graphql -f query="$threads_query" -F owner="$owner" -F name="$repo_name" -F number="$PR_NUMBER")"
            fi

            if ! jq -e '.data.repository.pullRequest.reviewThreads' >/dev/null <<< "$page"; then
              echo "::error::Could not read review threads; refusing auto-merge."
              exit 1
            fi

            page_unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<< "$page")"
            unresolved=$((unresolved + page_unresolved))
            has_next="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<< "$page")"
            if [[ "$has_next" != "true" ]]; then
              break
            fi
            cursor="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor' <<< "$page")"
            if [[ -z "$cursor" || "$cursor" == "null" ]]; then
              echo "::error::Could not paginate review threads safely."
              exit 1
            fi
          done

          if (( unresolved > 0 )); then
            echo "::error::Unresolved review threads remain: $unresolved."
            exit 1
          fi

          final_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          final_head="$(jq -r '.head.sha' <<< "$final_pr")"
          mergeable="$(jq -r '.mergeable // "unknown"' <<< "$final_pr")"
          merged="$(jq -r '.merged' <<< "$final_pr")"
          if [[ "$merged" == "true" ]]; then
            echo "::notice::PR is already merged."
            exit 0
          fi
          if [[ "$final_head" != "$EXPECTED_HEAD_SHA" || "$mergeable" != "true" ]]; then
            echo "::error::PR head changed or GitHub does not confirm mergeability."
            exit 1
          fi

          echo "Verified exact head, independent human approval, no change request and all review threads resolved."
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(gh pr merge "${PR_URL}" --auto --squash --delete-branch 2>&1)"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            printf '%s\\n' "${output}"
          elif [[ "${output}" == *"unstable status"* ]]; then
            echo "::notice::GitHub will enable auto-merge after this required workflow check completes; no branch protection or required check is bypassed."
          else
            printf '%s\\n' "${output}" >&2
            exit "${status}"
          fi
