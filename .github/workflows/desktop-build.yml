name: Pytyliki Desktop Build
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README*", "docs/**"]
  pull_request:
    paths: ["CMakeLists.txt", "src/**", "tests/**", ".github/workflows/desktop-build.yml", ".github/scripts/capture_desktop_screenshot.ps1"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    permissions:
      contents: write
    name: Windows x64 Win32 workstation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Configure C11 release build
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build GUI and command-line tools
        run: cmake --build build --config Release --parallel
      - name: Run CTest suite
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Capture live Windows workstation
        shell: pwsh
        run: .github/scripts/capture_desktop_screenshot.ps1 -FilePath "build/Release/pytyliki-gui.exe" -OutputPath "assets/screenshots/pytyliki-workstation.png" -StartupSeconds 15
      - name: Upload live desktop screenshot
        uses: actions/upload-artifact@v4
        with:
          name: pytyliki-live-windows-screenshot
          path: assets/screenshots/pytyliki-workstation.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit screenshot to same-repository pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'refresh-screenshot')
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/screenshots/pytyliki-workstation.png"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: refresh live Windows screenshot"
            git push origin "HEAD:$env:TARGET_BRANCH"
          } else {
            Write-Host "Screenshot is unchanged; no repository commit is needed."
          }
      - name: Prepare distributable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/pytyliki-gui.exe dist/
          Copy-Item build/Release/pytyliki.exe dist/
          Copy-Item build/Release/pytyliki-apsia.exe dist/
          Copy-Item build/Release/pytyliki-metrics.exe dist/
          Copy-Item build/Release/pytyliki-code-wellbeing.exe dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath Pytyliki-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Pytyliki-windows-x64
          path: Pytyliki-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Pytyliki-windows-x64
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/Pytyliki-windows-x64.zip
