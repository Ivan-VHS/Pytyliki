name: IRON CORE contract

on:
  pull_request:
    paths:
      - "iron/**"
      - "omega-null/**"
      - "schemas/omega-null.v0.schema.json"
      - "docs/OMEGA_NULL.md"
      - "tools/validate_omega_null.py"
      - "tests/test_omega_null_contract.py"
      - "schemas/iron-core.v1.schema.json"
      - "docs/IRON_CORE.md"
      - "docs/clusters/processor-labs.md"
      - "tools/validate_iron_core.py"
      - "tests/test_iron_core_contract.py"
      - ".github/workflows/iron-core-contract.yml"
  push:
    branches: [main]
    paths:
      - "iron/**"
      - "omega-null/**"
      - "schemas/omega-null.v0.schema.json"
      - "docs/OMEGA_NULL.md"
      - "tools/validate_omega_null.py"
      - "tests/test_omega_null_contract.py"
      - "schemas/iron-core.v1.schema.json"
      - "docs/IRON_CORE.md"
      - "docs/clusters/processor-labs.md"
      - "tools/validate_iron_core.py"
      - "tests/test_iron_core_contract.py"
      - ".github/workflows/iron-core-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: false
      - name: Validate machine-readable IRON contract
        run: python tools/validate_iron_core.py
      - name: Validate Omega-Null research profile
        run: python tools/validate_omega_null.py
      - name: Run IRON and Omega-Null contract regression tests
        run: python -m unittest discover -s tests -p "test_*contract.py" -v
