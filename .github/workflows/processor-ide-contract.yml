name: Processor IDE contract

on:
  pull_request:
    paths:
      - "contracts/processor-ide.v1.json"
      - "CMakeLists.txt"
      - "src/processor_ide.h"
      - "src/processor_ide.c"
      - "tests/test_processor_ide.c"
      - "src/low_level_contract.h"
      - "src/ironclad_systems.h"
      - "schemas/processor-ide.v1.schema.json"
      - "docs/PROCESSOR_IDE.md"
      - "project-contract.json"
      - "tools/validate_processor_ide.py"
      - "tests/test_processor_ide_contract.py"
      - "src/ironclad_systems.c"
      - "src/ironclad_systems.h"
      - "tests/test_ironclad_systems.c"
      - ".github/workflows/processor-ide-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/processor-ide.v1.json"
      - "schemas/processor-ide.v1.schema.json"
      - "docs/PROCESSOR_IDE.md"
      - "project-contract.json"
      - "tools/validate_processor_ide.py"
      - "tests/test_processor_ide_contract.py"
      - "src/ironclad_systems.c"
      - "src/ironclad_systems.h"
      - "tests/test_ironclad_systems.c"
      - ".github/workflows/processor-ide-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: false
      - name: Validate Processor IDE contract
        run: python tools/validate_processor_ide.py
      - name: Run Processor IDE contract tests
        run: python -m unittest discover -s tests -p "test_processor_ide_contract.py" -v
      - name: Configure native test build
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build native Processor IDE session tests
        run: cmake --build build --target pytyliki-processor-ide-tests --config Release
      - name: Run native Processor IDE session tests
        run: ctest --test-dir build -C Release -R "^processor-ide-session-tests$" --output-on-failure
